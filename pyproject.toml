[project]
name = "atlas"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=22.0",
    "google-genai>=1.33.0",
    "groq>=0.11.0",
    "sqlalchemy>=2.0",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
