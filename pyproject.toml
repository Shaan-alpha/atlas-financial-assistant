[project]
name = "atlas"
version = "0.1.0"
# 3.11 is the real floor (union annotations and zip(strict=) need 3.10). Kept
# permissive so a host defaulting to an older interpreter does not fail the build.
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=22.0",
    "google-genai>=1.33.0",
    "groq>=0.11.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
