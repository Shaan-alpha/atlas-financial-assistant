# Render Blueprint. Provisions the database and the bot together, so a single
# "New Blueprint Instance" gets Atlas running with persistence already wired.

databases:
  - name: atlas-db
    # Render's free Postgres is time-limited: it expires roughly a month after
    # creation and takes every user's onboarding and memory with it. Upgrade
    # before that matters.
    plan: free
    databaseName: atlas
    user: atlas
    # MUST match the web service region below. Render's internal database host
    # (dpg-...-a, with no domain suffix) only resolves inside its own region, so
    # a mismatch fails with "Name or service not known" at connect time.
    region: singapore

services:
  - type: web
    name: atlas-financial-assistant
    runtime: python
    plan: free
    region: singapore  # must equal the database region above
    buildCommand: pip install -e .
    startCommand: python -m atlas.main
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: LOG_LEVEL
        value: INFO

      # Postgres, wired automatically from the database above. Without it Atlas
      # falls back to SQLite, which a free web service wipes on every redeploy —
      # taking every user's onboarding and memory with it.
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString

      # Secrets: entered in the Render dashboard, never committed.
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # Market-data providers, tried in this order. yfinance alone is not enough:
      # Yahoo blocks datacenter IPs, so it works locally and fails in production.
      # Any subset may be set; missing keys are skipped, not errors.
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false

      # This service's own public URL, e.g. https://atlas-financial-assistant.onrender.com
      # Enables the 10-minute self-ping that stops the free tier sleeping, so a
      # judge never waits ~50s on a cold start.
      #
      # The service has no URL until it exists, so this is filled in after the
      # first deploy. Skipping it is not an error -- the bot boots fine and just
      # sleeps -- so the startup log warns when it is unset. A bare hostname is
      # accepted; the scheme is added for you.
      - key: PUBLIC_URL
        sync: false
